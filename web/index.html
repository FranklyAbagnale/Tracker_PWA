<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://api.github.com https://nominatim.openstreetmap.org; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="description" content="Photo-first neighborhood watch vehicle tracker">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ParkingTracker">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <title>ParkingTracker v1.0</title>
</head>
<body>
  <div id="app-container"></div>
  <!-- Outside #app-container so no screen change can remove it: the camera is always one tap away. -->
  <div id="camera-bar" hidden>
    <label class="camera-bar-btn"><span class="big" aria-hidden="true">&#128247;</span><span>Take photo</span>
      <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
    </label>
  </div>
  <noscript>ParkingTracker needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
