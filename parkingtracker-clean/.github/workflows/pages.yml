name: Deploy app to GitHub Pages

# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
#
# ACTIONS-MINUTES RULE: runs only when web/ (the app code) changes, which only the
# owner does. Data and photo commits from the app never touch web/, so usage does
# not grow with the number of users. tests/test_workflows.py enforces this.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
