name: Validate

# ACTIONS-MINUTES RULE: field-app activity must never start a workflow.
# The app commits to data/ and photos/ many times per save, so this workflow runs
# only on pull requests (the owner's changes) or by hand. The app maintains
# data/index.json itself. After a test session run `npm run validate` locally
# (free). tests/test_workflows.py enforces this rule.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python3 scripts/validate_records.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm test
